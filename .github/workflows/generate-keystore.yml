name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate GP Connect Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore gp-connect-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias gp-connect \
            -storepass "GPConnectTemp2026!" \
            -keypass "GPConnectTemp2026!" \
            -dname "CN=GP Connect, OU=GP Connect, O=Gumla Polytechnic, L=Gumla, ST=Jharkhand, C=IN"

      - name: Verify keystore
        run: |
          keytool -list \
            -keystore gp-connect-release.jks \
            -storepass "GPConnectTemp2026!"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: gp-connect-release-keystore
          path: gp-connect-release.jks
          retention-days: 1