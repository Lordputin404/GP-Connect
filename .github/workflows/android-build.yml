name: Android Debug Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install platform 36 (non-interactive)
        # ubuntu-latest ships the Android SDK with sdkmanager on PATH, but image
        # updates can reset license state, which previously made the
        # setup-android action hang on an "Accept? (y/N):" prompt. Accepting
        # licenses here with `yes |` guarantees every sdkmanager prompt is
        # answered, so nothing can ever block on stdin. Only the platform
        # required by compileSdk 36 is installed explicitly; AGP auto-installs
        # its own preferred build-tools once licenses are accepted.
        run: |
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36"

      - name: Set up Gradle (with caching)
        # Caches the Gradle user home (dependency artifacts and wrapper
        # distributions) between runs.
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK output exists
        run: |
          echo "APK output directory contents:"
          ls -lh app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -name '*.apk')"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-connect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
