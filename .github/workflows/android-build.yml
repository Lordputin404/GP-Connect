name: Android Debug Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # Accepts SDK licenses so the Android Gradle plugin can auto-install
        # any platform/build-tools component the runner image is missing.
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        # Caches the Gradle user home (dependency artifacts and wrapper
        # distributions) between runs.
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK output exists
        run: |
          echo "APK output directory contents:"
          ls -lh app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -name '*.apk')"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-connect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
