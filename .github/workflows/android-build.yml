name: Android Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (deterministic, non-interactive)
        # The ubuntu-24.04 image already ships everything assembleDebug needs
        # (platforms android-36 rev 2; build-tools 34.0.0-37.0.0), so no SDK
        # packages are installed here. The current sdkmanager's `--licenses`
        # interview no longer completes under piped stdin (both the
        # setup-android action and `yes |` stalled at the "(y/N)?" prompt), so
        # acceptance of the two standard SDK licenses is recorded directly via
        # their hash files — identical to what answering "y" writes. No other
        # license categories (Google TV, XR, emulator, ...) are touched, no
        # command can block on stdin, and AGP can silently auto-provision a
        # component in the unlikely event one is ever missing.
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$SDK_ROOT/licenses/android-sdk-preview-license"
          echo "Preinstalled platforms:";   ls "$SDK_ROOT/platforms" || true
          echo "Preinstalled build-tools:"; ls "$SDK_ROOT/build-tools" || true

      - name: Set up Gradle (with caching)
        # Caches the Gradle user home (dependency artifacts and wrapper
        # distributions) between runs.
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK output exists
        run: |
          echo "APK output directory contents:"
          ls -lh app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -name '*.apk')"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-connect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Assemble Signed Release APK
    runs-on: ubuntu-latest
    # Signed release builds run for pushes to main and for any manual
    # (workflow_dispatch) run. Pushes to other branches build the debug APK
    # only — this job shows up as skipped for them.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses (deterministic, non-interactive)
        # Same preinstalled-image approach as the debug job: assembleRelease
        # needs the same platforms android-36 / build-tools versions, and the
        # verification step additionally uses apksigner from the preinstalled
        # build-tools directory.
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$SDK_ROOT/licenses/android-sdk-preview-license"
          echo "Preinstalled platforms:";   ls "$SDK_ROOT/platforms" || true
          echo "Preinstalled build-tools:"; ls "$SDK_ROOT/build-tools" || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        # Recreates gp-connect-release.jks at the repository root from the
        # RELEASE_KEYSTORE_BASE64 secret. The file exists only for the
        # lifetime of this job on the ephemeral runner and is deleted in the
        # final step; it is never committed to the repository.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r' | base64 --decode > gp-connect-release.jks
          test -s gp-connect-release.jks

      - name: Build signed release APK
        # app/build.gradle.kts reads the release signing credentials from
        # these environment variables (GP_CONNECT_STORE_FILE is the path of
        # the decoded keystore, relative to the repository root).
        env:
          GP_CONNECT_STORE_FILE: gp-connect-release.jks
          GP_CONNECT_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          GP_CONNECT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          GP_CONNECT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for v in GP_CONNECT_STORE_FILE GP_CONNECT_STORE_PASSWORD GP_CONNECT_KEY_ALIAS GP_CONNECT_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set (check the repository secrets)" >&2
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK is signed with the release key
        # Proves the produced APK is signed with the certificate of the
        # configured release keystore (not the debug key): the signer
        # certificate SHA-256 of the APK must equal the certificate SHA-256
        # of the keystore entry. The digest is printed in the log so runs
        # built from the same secrets can be compared.
        env:
          GP_CONNECT_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          GP_CONNECT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release" >&2
            exit 1
          fi
          APKSIGNER="$(ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in the preinstalled build-tools" >&2
            exit 1
          fi
          echo "Release APK: $APK"
          "$APKSIGNER" verify --print-certs "$APK"
          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          KS_CERT_SHA256="$(keytool -list -v -keystore gp-connect-release.jks \
            -alias "$GP_CONNECT_KEY_ALIAS" -storepass "$GP_CONNECT_STORE_PASSWORD" \
            | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          echo "APK signer certificate SHA-256: $APK_CERT_SHA256"
          echo "Keystore entry certificate SHA-256: $KS_CERT_SHA256"
          if [ -z "$APK_CERT_SHA256" ] || [ "$APK_CERT_SHA256" != "$KS_CERT_SHA256" ]; then
            echo "::error::Release APK is NOT signed with the configured release keystore key" >&2
            exit 1
          fi
          echo "Release APK is signed with the configured release keystore key."

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-connect-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary release keystore
        # Runs even when an earlier step fails, so the decoded keystore never
        # outlives the job (the runner is ephemeral anyway — this is defense
        # in depth).
        if: always()
        run: |
          rm -f gp-connect-release.jks
          echo "Removed the temporary release keystore."
